/* ============================================================
   BASE RESET
   ============================================================ */

h1,
h2,
h3,
h4,
h5,
h6,
p {
  font-family: var(--font-family-primary);
  font-style: normal;
  font-variation-settings: "slnt" 0, "wdth" 10, "GRAD" 8, "ROND" 0;
  margin: 0;
}

body {
  font-family: var(--font-family-primary);
  font-style: normal;
}

a {
  color: var(--text-interactive);
  text-decoration: underline;
}

a:hover {
  color: var(--interactive-hover);
  cursor: pointer;
}

.pill {
  display: inline-flex;
  align-items: center;
  padding: 0px 8px;
  border-radius: var(--border-radius-full);
  gap: 3px;
  font-size: var(--fontsize-body-sm);
  background: var(--status-neutral-bg);
  color: var(--text-primary);
  border: 0.5px solid var(--status-neutral-border)
}

.pill-success {
  background: var(--status-success-bg);
  border: 1px solid var(--status-success-border);
  color: var(--text-primary);
}

.pill-warn {
  background: var(--status-warning-bg);
  border: solid 1px var(--status-warning-border)
}

/* ============================================================
   SEMANTIC TOKENS — Titanium Theme (default)
   ============================================================ */

:root,
[data-theme="titanium"] {
  /* Backgrounds */
  --bg-page: var(--color-titanium-100);
  --bg-surface: var(--color-white);
  --bg-subtle: var(--color-titanium-200);
  --bg-muted: var(--color-titanium-50);
  --bg-inverse: var(--color-carbon-600);
  /* Text */
  --text-primary: var(--color-carbon-500);
  --text-secondary: var(--color-carbon-100);
  --text-tertiary: var(--color-titanium-900);
  --text-interactive: var(--color-patina-600);
  --text-on-dark: var(--color-titanium-00);
  /* Borders */
  --border-default: var(--color-titanium-700);
  --border-subtle: var(--color-titanium-400);
  --border-tertiary: var(--color-titanium-300);
  --border-focus: var(--color-patina-400);
  /* Interactive */
  --interactive-default: var(--color-patina-500);
  --interactive-hover: var(--color-patina-400);
  --interactive-pressed: var(--color-patina-600);
  --interactive-bg-subtle: var(--color-patina-25);
  /* Accent */
  --accent-default: var(--color-gold-500);
  --accent-strong: var(--color-gold-700);
  --accent-bg: var(--color-gold-00);
  /* Status — Success */
  --status-success-bg: var(--color-green-50);
  --status-success-border: var(--color-green-600);
  /* Status — Warning */
  --status-warning-bg: var(--color-copper-00);
  --status-warning-border: var(--color-copper-300);
  /* Status — Error */
  --status-error-bg: var(--color-red-00);
  --status-error-border: var(--color-red-300);
  /* Status — Neutral */
  --status-neutral-bg: var(--color-titanium-100);
  --status-neutral-border: var(--color-titanium-800);
  /* Status — Info */
  --status-info-bg: var(--color-patina-00);
  --status-info-border: var(--color-patina-400);
  /* Overlays */
  --overlay-modal: rgb(from var(--color-black) r g b / 0.6);
  --overlay-panel: rgb(from var(--color-black) r g b / 0.2);
}


/* ============================================================
   BUTTONS
   ============================================================ */

.btn-primary {
  background: var(--interactive-default);
  color: var(--color-white);
  border: none;
  border-radius: var(--border-radius-full);
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.03em;
  transition: background 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary:hover {
  background: var(--interactive-hover);
}

.btn-secondary {
  background: var(--bg-surface);
  color: var(--interactive-default);
  border: 1px solid var(--interactive-default);
  border-radius: var(--border-radius-full);
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.03em;
  transition: border-color 0.15s, color 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: fit-content;
}

.btn-secondary:hover {
  background-color: var(--interactive-bg-subtle);
}

.btn-ghost {
  font-weight: var(--font-weight-semibold);
  border: solid 1px transparent;
  background: none;
  color: var(--text-tertiary);
  padding: 8px 12px;
  font-size: var(--fontsize-body-sm);
  gap: 8px;
  display: flex;
  align-items: center;
}

.btn-ghost:hover {
  cursor: pointer;
  opacity: 0.8;
}

.submit-btn {
  background: var(--interactive-default);
  color: var(--color-white);
  border: none;
  border-radius: var(--border-radius-full);
  padding: 10px 28px;
  font-size: var(--fontsize-body-md);
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: background 0.15s;

}

.submit-btn:disabled {
  opacity: 0.5;
  cursor: default;
  /*    background-color: var(--titanium-500);*/
  pointer-events: none;
}


.submit-btn:hover {
  background: var(--interactive-hover);
}

/* Radius aliases used by the shared sidebar component */
:root {
  --r-sm: var(--border-radius-sm);
  --r-md: var(--border-radius-md);
}

/* ============================================================
   PL-SHARED — sidebar-component.js CSS  (inlined)
   ============================================================ */
:root {
  --sidebar-w:       192px;
  --sidebar-cw:       52px;
  --sidebar-bg:      var(--bg-inverse);
  --sidebar-active:  var(--accent-default);
  --sidebar-text:    color-mix(in srgb, var(--text-on-dark) 80%, transparent);
  --sidebar-muted:   color-mix(in srgb, var(--text-on-dark) 38%, transparent);
  --sidebar-hover:   color-mix(in srgb, var(--text-on-dark)  7%, transparent);
  --sidebar-divider: color-mix(in srgb, var(--text-on-dark)  9%, transparent);
}
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--sidebar-bg);
  display: flex; flex-direction: column;
  flex-shrink: 0; overflow: hidden;
  transition: width .22s ease, min-width .22s ease;
  z-index: 200;
}
.sidebar.collapsed { width: var(--sidebar-cw); min-width: var(--sidebar-cw); }
.sidebar-profile {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 16px 12px 12px; gap: 6px; flex-shrink: 0;
}
.sb-profile-text { overflow: hidden; }
.sb-name {
  font-size: 13.5px; font-weight: 600; color: var(--sidebar-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
}
.sb-role { font-size: 10px; color: var(--sidebar-muted); white-space: nowrap; margin-top: 1px; }
.sidebar.collapsed .sb-profile-text { display: none; }
.sidebar.collapsed .sidebar-profile  { justify-content: center; padding: 14px 0 12px; }
.sb-collapse {
  width: 24px; height: 24px; border: none; background: none; cursor: pointer;
  color: var(--sidebar-muted); border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex-shrink: 0; margin-top: 1px;
  transition: color .15s, background .15s;
}
.sb-collapse:hover { color: var(--sidebar-text); background: var(--sidebar-hover); }
.sb-collapse i { transition: transform .22s ease; }
.sidebar.collapsed .sb-collapse i { transform: rotate(180deg); }
.sb-hr { height: 1px; background: var(--sidebar-divider); margin: 0 10px 6px; flex-shrink: 0; }
.sidebar-nav { flex: 1; padding: 0 6px; overflow-y: auto; }
.sidebar-nav::-webkit-scrollbar { display: none; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px; border-radius: var(--r-md);
  cursor: pointer; color: var(--sidebar-text);
  font-size: 13px; font-weight: 400;
  white-space: nowrap; margin-bottom: 1px;
  transition: background .12s, color .12s; user-select: none;
}
.nav-item:hover { background: var(--sidebar-hover); color: var(--text-on-dark); }
.nav-item.active { background: var(--sidebar-active); color: var(--bg-inverse); font-weight: 600; }
.nav-item i { width: 16px; text-align: center; font-size: 13px; flex-shrink: 0; }
.nav-item span { overflow: hidden; text-overflow: ellipsis; }
.sidebar.collapsed .nav-item span { display: none; }
.sidebar.collapsed .nav-item      { justify-content: center; padding: 9px 0; }
.sidebar.collapsed .nav-item i    { width: auto; }
.nav-lbl {
  font-size: 9px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--sidebar-muted);
  padding: 10px 8px 3px; white-space: nowrap;
}
.sidebar.collapsed .nav-lbl { display: none; }
.nav-sub {
  display: flex; align-items: center;
  padding: 5px 8px 5px 30px; font-size: 11.5px;
  color: var(--sidebar-muted); cursor: pointer;
  border-radius: var(--r-sm); white-space: nowrap;
  margin-bottom: 1px; transition: color .12s, background .12s;
}
.nav-sub:hover { color: var(--sidebar-text); background: var(--sidebar-hover); }
.sidebar.collapsed .nav-sub { display: none; }
.sidebar-bottom { padding: 6px; border-top: 1px solid var(--sidebar-divider); flex-shrink: 0; }

/* ============================================================
   SHELL  (matches customer-management.css conventions)
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-family-primary);
  color: var(--text-primary);
  display: flex;
}

.main {
  display: flex; flex-direction: column;
  background: var(--bg-page);
  width: 100%; height: 100vh; overflow-y: auto;
}

/* ── PRIMARY TABS (Metrics / Department / Reports) — page level ──
   Same .tab-btn treatment as job maintenance (job-detail.css) and
   customer maintenance: filled pill, uppercase bold label, solid
   accent fill on the active tab. Sized to content here rather than
   flex:1, since this row has icons and doesn't need to fill the width. */
.primary-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 20px;
  flex: 1;
  border: 1px solid var(--border-subtle);
  border-radius: var(--border-radius-md);
  background: var(--bg-surface);
  color: var(--text-interactive);
  font-family: var(--font-family-primary);
  font-size: var(--fontsize-body-sm);
  font-weight: var(--font-weight-bold);
  text-transform: uppercase;
  letter-spacing: .02em;
  cursor: pointer; user-select: none;
  transition: color .15s, border-color .15s, background .15s;
}
.tab-btn:hover { color: var(--interactive-hover); }
.tab-btn.active {
  color: var(--color-white);
  background: var(--interactive-default);
  border-color: var(--interactive-default);
}

/* ── PAGE CONTENT ── */
.page-content {
  max-width: var(--container-data);
  margin: 32px auto 56px;
  width: 100%;
  padding: 0 32px;
}

/* ── SEARCH + EXPLORE ROW ── */
.search-filter-row {
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap; margin-bottom: 20px;
}
.search-filter-row .report-search { flex: 1 1 280px; margin-bottom: 0; }
.explore-btn { flex-shrink: 0; margin-left: auto; white-space: nowrap; }

/* ── REPORT SEARCH ── */
.report-search { position: relative; }
.report-search .search-container { max-width: none; }
.search-dropdown {
  position: absolute; top: 100%; left: 0; right: 0;
  margin: 0; list-style: none;
  background: var(--bg-surface);
  border: 1px solid var(--border-focus);
  border-top: none;
  border-radius: 0 0 var(--border-radius-md) var(--border-radius-md);
  box-shadow: 0 10px 24px var(--overlay-panel);
  max-height: 280px; overflow-y: auto; z-index: 120;
  display: none;
}
.report-search.open .search-dropdown { display: block; }
.report-search.open .search-container {
  border-color: var(--border-focus);
  border-radius: var(--border-radius-md) var(--border-radius-md) 0 0;
}
.search-dropdown li {
  padding: 8px 12px; cursor: pointer;
  font-size: var(--fontsize-body-md);
  color: var(--text-primary);
  display: flex; align-items: center; gap: 8px;
  border-left: 3px solid transparent;
}
.search-dropdown li:hover { background: var(--bg-muted); }
.search-dropdown li.active {
  background: var(--interactive-bg-subtle);
  border-left-color: var(--border-focus);
  font-weight: var(--font-weight-semibold);
}
.search-dropdown li .dept {
  margin-left: auto;
  font-size: var(--fontsize-body-sm);
  color: var(--text-tertiary);
  font-weight: var(--font-weight-book);
}
.search-dropdown li.empty { color: var(--text-tertiary); cursor: default; }
.search-dropdown li.empty:hover { background: none; }

/* ── DEPARTMENT FILTER PILLS ── */
.filter-pills {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.filter-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--border-radius-full);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-family: var(--font-family-primary);
  font-size: var(--fontsize-body-sm);
  font-weight: var(--font-weight-semibold);
  cursor: pointer; user-select: none;
  transition: background .12s, border-color .12s, color .12s;
}
.filter-pill:hover { border-color: var(--interactive-default); color: var(--interactive-default); }
.filter-pill.on {
  background: var(--interactive-default);
  border-color: var(--interactive-default);
  color: var(--color-white);
}
.filter-pill.on:hover { background: var(--interactive-hover); border-color: var(--interactive-hover); color: var(--color-white); }
.filter-pill .cnt {
  font-size: var(--fontsize-label);
  font-weight: var(--font-weight-book);
  opacity: .75;
}
.filter-pill i { font-size: 9px; }
.filter-pills .clear-filters {
  background: none; border: none; cursor: pointer;
  font-family: var(--font-family-primary);
  font-size: var(--fontsize-body-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-interactive);
  padding: 5px 4px; margin-left: 2px;
}
.filter-pills .clear-filters:hover { text-decoration: underline; }
.filter-pills .divider {
  width: 1px; height: 18px;
  background: var(--border-tertiary);
  margin: 0 4px;
}
.filter-pills .pills-label {
  font-size: var(--fontsize-label);
  font-weight: var(--font-weight-bold);
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-right: 2px;
}

/* ── OPEN REPORT TABS ──
   Browser-style dismissable tabs: one per report the user has opened via
   search. The active tab welds onto the report-panel below it (same
   background, overlapping border) so the two read as one folder unit. */
.report-tabs {
  display: flex; align-items: flex-end; gap: 4px;
  flex-wrap: wrap;
}
.report-tab {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px 10px 16px;
  background: var(--bg-muted);
  border: 1px solid var(--border-default);
  border-bottom: none;
  border-radius: var(--border-radius-md) var(--border-radius-md) 0 0;
  color: var(--text-secondary);
  font-size: var(--fontsize-body-sm);
  font-weight: var(--font-weight-semibold);
  cursor: pointer; user-select: none;
  transition: background .12s, color .12s;
}
.report-tab:hover { color: var(--text-primary); }
.report-tab.active {
  background: var(--bg-surface);
  color: var(--text-interactive);
  position: relative;
  margin-bottom: -1px;
  padding-bottom: 11px;
  z-index: 2;
}
.report-tab .tab-close {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--border-radius-sm);
  color: var(--text-tertiary);
  font-size: 10px;
  transition: background .12s, color .12s;
}
.report-tab .tab-close:hover { background: var(--overlay-panel); color: var(--text-primary); }
.report-tab.single .tab-close { visibility: hidden; }

.report-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 0 var(--border-radius-md) var(--border-radius-md) var(--border-radius-md);
  padding: 20px;
  position: relative;
  z-index: 1;
}
.report-panel .card { margin: 0; }

/* ── EXPLORE REPORTS DRAWER ──
   Same slide-in-from-right pattern as customer-management.css's
   .modal-overlay/.modal-panel, holding the full catalog grouped by
   department — the Option A rail, as an on-demand drawer instead of a
   permanent column. */
.explore-overlay {
  position: fixed; inset: 0;
  background: var(--overlay-modal);
  z-index: 250;
  display: flex; align-items: flex-start; justify-content: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.explore-overlay.open { opacity: 1; pointer-events: all; }
.explore-panel {
  width: 380px; height: 100vh;
  background: var(--bg-surface);
  box-shadow: -4px 0 24px rgba(0, 0, 0, .15);
  transform: translateX(40px);
  transition: transform .25s cubic-bezier(.25,.46,.45,.94);
  display: flex; flex-direction: column;
}
.explore-overlay.open .explore-panel { transform: translateX(0); }
.explore-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.explore-title {
  display: flex; align-items: center; gap: 8px;
  font-size: var(--fontsize-body-lg);
  font-weight: var(--font-weight-bold);
  color: var(--text-primary);
}
.explore-title i { color: var(--text-interactive); font-size: 15px; }
.modal-close {
  width: 32px; height: 32px;
  border: none; background: none; cursor: pointer;
  border-radius: var(--border-radius-sm);
  color: var(--text-tertiary);
  font-size: 20px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.modal-close:hover { background: var(--bg-muted); color: var(--text-primary); }
.explore-search {
  margin: 14px 20px;
  position: relative;
  display: flex; align-items: center;
  border: 1px solid var(--border-subtle);
  border-radius: var(--border-radius-md);
  background: var(--bg-surface);
  flex-shrink: 0;
}
.explore-search:focus-within { border-color: var(--border-focus); }
.explore-search i { color: var(--text-tertiary); padding: 0 10px; font-size: 12px; }
.explore-search input {
  flex: 1; border: none; outline: none; background: none;
  padding: 8px 10px 8px 0;
  font-family: var(--font-family-primary);
  font-size: var(--fontsize-body-md);
  color: var(--text-primary);
}
.explore-list { flex: 1; overflow-y: auto; padding-bottom: 12px; }
.explore-list .group-label {
  display: flex; justify-content: space-between;
  font-size: var(--fontsize-label);
  font-weight: var(--font-weight-bold);
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-tertiary);
  padding: 14px 20px 6px;
}
.explore-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 20px;
  font-size: var(--fontsize-body-md);
  color: var(--text-primary);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background .1s;
}
.explore-item:hover { background: var(--bg-muted); }
.explore-item.active {
  background: var(--interactive-bg-subtle);
  border-left-color: var(--border-focus);
  color: var(--text-interactive);
  font-weight: var(--font-weight-semibold);
}
.explore-item .name { flex: 1; }
.explore-item .open-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--interactive-default);
  flex-shrink: 0;
}
.explore-empty {
  padding: 24px 20px;
  color: var(--text-tertiary);
  font-size: var(--fontsize-body-md);
  text-align: center;
}

/* ── TOOLBAR ── */
.report-toolbar {
  display: flex; align-items: flex-end; gap: 16px;
  flex-wrap: wrap; margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-subtle);
}
.field label {
  display: block;
  font-size: var(--fontsize-label);
  font-weight: var(--font-weight-semibold);

.search-container {
  position: relative; flex: 1;

  border: 1px solid var(--border-subtle);
  border-radius: var(--border-radius-md);
  background: var(--bg-surface);
}
.search-container i { color: var(--text-tertiary); padding: 0 10px; font-size: 12px; }
.search-container:focus-within { border-color: var(--border-focus); }
.search-input {
  width: 100%; padding: 7px 10px 7px 0;
  border: none; outline: none; background: none;
  font-family: var(--font-family-primary);

.row-count { margin-left: auto; color: var(--text-tertiary); }

.report-table { width: 100%; border-collapse: collapse; }
.report-table thead tr {

}
.report-table th {

.report-table tbody tr { border-bottom: 1px solid var(--border-subtle); }

.report-table td {

::-webkit-scrollbar { width: 6px; height: 8px; }

<script>
  window.toggleSidebar = function () {
    document.getElementById('sidebar').classList.toggle('collapsed');
  };

  document.querySelectorAll('.primary-tabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.primary-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  /* ── Report catalog — every report belongs to a department ── */
  const DEPARTMENTS = ['Creative Services', 'Pre-Press', 'Press', 'Bindery', 'Shipping', 'Woodshop'];

  const REPORTS = [
    { name: 'Proof Out Aging',        dept: 'Creative Services' },
    { name: 'Art Request Queue',      dept: 'Creative Services' },
    { name: 'Prepress To Press',      dept: 'Pre-Press' },
    { name: 'Plate Queue',            dept: 'Pre-Press' },
    { name: 'Press To Bindery',       dept: 'Press' },
    { name: 'Press Makeready',        dept: 'Press' },
    { name: 'Bindery To Shipping',    dept: 'Bindery' },
    { name: 'Finishing Queue',        dept: 'Bindery' },
    { name: 'Bindery Quality Holds',  dept: 'Bindery' },
    { name: 'Shipping To Delivery',   dept: 'Shipping' },
    { name: 'Freight Consolidation',  dept: 'Shipping' },
    { name: 'Woodshop Check-Out',     dept: 'Woodshop' },
  ];

  /* Active department filters — empty Set means "all departments".
     These only scope what search can find; they never touch which
     report tabs are open or which one is active. */
  const activeDepts = new Set();

  /* Open report tabs, in the order they were opened. The report showing
     in the panel is always the last-focused entry in this list. */
  const openTabs = ['Bindery To Shipping'];
  let activeReport = 'Bindery To Shipping';
  let query = '';

  const reportByName = n => REPORTS.find(r => r.name === n);
  const deptCount = d => REPORTS.filter(r => r.dept === d).length;

  function visibleReports() {
    return REPORTS.filter(r => !activeDepts.size || activeDepts.has(r.dept));
  }

  /* Bring a report into view — opens a new tab for it if needed, or just
     focuses the existing one. */
  function openReport(name) {
    if (!openTabs.includes(name)) openTabs.push(name);
    activeReport = name;
    renderAll();
  }

  /* ── Department filter pills ── */
  function renderPills() {
    const el = document.getElementById('dept-pills');
    el.innerHTML =
      `<span class="pills-label">Department</span>` +
      `<button class="filter-pill ${activeDepts.size ? '' : 'on'}" data-all="1">All</button>` +
      `<span class="divider"></span>` +
      DEPARTMENTS.map(d => `
        <button class="filter-pill ${activeDepts.has(d) ? 'on' : ''}" data-dept="${d}">
          ${activeDepts.has(d) ? '<i class="fa-regular fa-check"></i>' : ''}${d}
          <span class="cnt">${deptCount(d)}</span>
        </button>`).join('') +
      (activeDepts.size ? `<button class="clear-filters" id="clear-filters">Clear filters</button>` : '');

    el.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.all) activeDepts.clear();
        else {
          const d = btn.dataset.dept;
          activeDepts.has(d) ? activeDepts.delete(d) : activeDepts.add(d);
        }
        renderAll();
      });
    });
    const clear = document.getElementById('clear-filters');
    if (clear) clear.addEventListener('click', () => { activeDepts.clear(); renderAll(); });
  }

  /* ── Report search — scoped to whichever departments are active in the
     pills above it, so search never surfaces a report the pills are hiding.
     Picking a result opens (or focuses) its tab. ── */
  const searchWrap  = document.getElementById('report-search');
  const searchInput = document.getElementById('report-search-input');

  function renderSearchMenu() {
    const q = query.toLowerCase().trim();
    const hits = visibleReports().filter(r =>
      !q || r.name.toLowerCase().includes(q) || r.dept.toLowerCase().includes(q));
    document.getElementById('report-search-menu').innerHTML = hits.length
      ? hits.map(r => `
          <li class="${r.name === activeReport ? 'active' : ''}" data-report="${r.name}">
            ${r.name}<span class="dept">${r.dept}</span>
          </li>`).join('')
      : `<li class="empty">No reports match “${query}” in the selected department${activeDepts.size === 1 ? '' : 's'}</li>`;
    document.querySelectorAll('#report-search-menu li[data-report]').forEach(li => {
      li.addEventListener('click', () => {
        query = ''; searchInput.value = '';
        searchWrap.classList.remove('open');
        openReport(li.dataset.report);
      });
    });
  }

  searchInput.addEventListener('input', () => {
    query = searchInput.value;
    searchWrap.classList.add('open');
    renderSearchMenu();
  });
  searchInput.addEventListener('focus', () => {
    searchWrap.classList.add('open');
    renderSearchMenu();
  });
  searchWrap.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => searchWrap.classList.remove('open'));

  /* ── Open report tabs ── */
  function renderTabs() {
    document.getElementById('report-tabs').innerHTML = openTabs.map(name => `
      <div class="report-tab ${name === activeReport ? 'active' : ''} ${openTabs.length === 1 ? 'single' : ''}" data-report="${name}">
        <span>${name}</span>
        <span class="tab-close" title="Close ${name}"><i class="fa-regular fa-xmark"></i></span>
      </div>`).join('');

    document.querySelectorAll('.report-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeReport = tab.dataset.report;
        renderAll();
      });
      tab.querySelector('.tab-close').addEventListener('click', e => {
        e.stopPropagation();
        if (openTabs.length === 1) return; // always leave one report open
        const name = tab.dataset.report;
        const i = openTabs.indexOf(name);
        openTabs.splice(i, 1);
        if (activeReport === name) activeReport = openTabs[Math.max(0, i - 1)];
        renderAll();
      });
    });

    document.title = 'Reports — ' + activeReport;
  }

  /* ── Sample result set ── */
  const HEAD = ['Production Type','Job Num','Sum','Detail Count','Customer Num','Customer','Job Description','Old Location','New Location','Date Moved'];
  const NUMERIC = new Set([2, 3, 4]);
  const ROWS = [
    ["PRI","403203","200","2","24813","Four Seasons Resort Maui At Wailea","Ferraro's Lunch Menu Covers","To Be Figured","Shipped","Aug 11 2026"],
    ["BI","404045","700","2","35035","Bari Hospitality","Bari Wine Menu Cover","Logo Decoration","Bindery Quality Check","Aug 11 2026"],
    ["BI","406212","230","1","8996","Streamsong Resort Golf & Spa","Streamsong Compendium","Logo Decoration","Bindery Quality Check","Aug 11 2026"],
    ["BI","409427","100","1","36319","1922 Club @ Ohio Stadium - Levy Restaurants","1922 Club Check Presenter","Logo Decoration","Shipping Priority","Aug 11 2026"],
    ["BI","405171","75","1","33108","Polpo Ristorante","Amara Drink Cover","Table 4 - Stick em up","Bindery Quality Check","Aug 11 2026"],
    ["BI","382758","75","1","1700","Renaissance Pittsburgh","Property Check Presenters","Woodshop Check-Out","Bindery Quality Check","Aug 11 2026"],
    ["BI","407394","45","2","13659","Celebrity Cruises Inc.","Solstice - Mdr Dinner + Fine Cut Dinner","Distro In Production","Shipping","Aug 11 2026"],
    ["BI","408507","50","1","12283","Residence Inn Bangor","Formal Timber Check Presenters","Bindery Finishing","Bindery Quality Check","Aug 11 2026"],
  ];

  function renderTable() {
    const q = (document.getElementById('table-search').value || '').toLowerCase().trim();
    const rows = ROWS.filter(r => !q || r.join(' ').toLowerCase().includes(q));
    let h = '<thead><tr>';
    HEAD.forEach((c, i) => h += `<th class="${NUMERIC.has(i) ? 'num' : ''}">${c}</th>`);
    h += '</tr></thead><tbody>';
    rows.forEach(r => {
      h += '<tr>';
      r.forEach((c, i) => {
        const cls = [NUMERIC.has(i) ? 'num' : '', i === 1 ? 'job' : '', i === 9 ? 'mute' : ''].join(' ').trim();
        h += `<td class="${cls}">${c}</td>`;
      });
      h += '</tr>';
    });
    h += '</tbody>';
    document.getElementById('report-table').innerHTML = h;
    const label = `${rows.length} of ${ROWS.length} rows`;
    document.getElementById('row-count').textContent = label;
    document.getElementById('footer-count').textContent = label;
  }
  document.getElementById('table-search').addEventListener('input', renderTable);

  /* ── Explore Reports drawer — the full catalog, grouped by department,
     unaffected by the pill filters above (it's the escape hatch to browse
     everything). Opening a report from here behaves just like search. ── */
  const exploreOverlay = document.getElementById('explore-overlay');
  const exploreInput = document.getElementById('explore-search-input');
  let exploreQuery = '';

  function renderExploreList() {
    const q = exploreQuery.toLowerCase().trim();
    const groups = DEPARTMENTS
      .map(d => ({
        dept: d,
        reports: REPORTS.filter(r => r.dept === d && (!q || r.name.toLowerCase().includes(q))),
      }))
      .filter(g => g.reports.length);

    document.getElementById('explore-list').innerHTML = groups.length
      ? groups.map(g => `
          <div class="group-label"><span>${g.dept}</span><span>${g.reports.length}</span></div>
          ${g.reports.map(r => `
            <div class="explore-item ${r.name === activeReport ? 'active' : ''}" data-report="${r.name}">
              <span class="name">${r.name}</span>
              ${openTabs.includes(r.name) ? '<span class="open-dot" title="Currently open"></span>' : ''}
            </div>`).join('')}
        `).join('')
      : `<div class="explore-empty">No reports match “${exploreQuery}”</div>`;

    document.querySelectorAll('.explore-item').forEach(el => {
      el.addEventListener('click', () => {
        openReport(el.dataset.report);
        closeExplore();
      });
    });
  }

  function openExplore() {
    exploreOverlay.classList.add('open');
    exploreQuery = ''; exploreInput.value = '';
    renderExploreList();
    exploreInput.focus();
  }
  function closeExplore() { exploreOverlay.classList.remove('open'); }

  document.getElementById('explore-btn').addEventListener('click', openExplore);
  document.getElementById('explore-close').addEventListener('click', closeExplore);
  exploreOverlay.addEventListener('click', e => { if (e.target === exploreOverlay) closeExplore(); });
  exploreInput.addEventListener('input', () => { exploreQuery = exploreInput.value; renderExploreList(); });

  function renderAll() {
    renderPills(); renderSearchMenu(); renderTabs(); renderTable();
    if (exploreOverlay.classList.contains('open')) renderExploreList();
  }
  function showToast() { renderTable(); }

  renderAll();
</script>
</body>

</html>
